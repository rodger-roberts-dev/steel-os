# Steel OS (STEEL-36): password recovery folders.
# Security-question hashes, root only.
d /var/lib/steel-os/recovery         0700 root root -
# Where the login screen leaves a "reset requested" note. Only the login
# screen (sddm) and root can use it.
d /var/lib/steel-os/recovery-request 0700 sddm sddm -
