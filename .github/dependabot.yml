# Steel OS (STEEL-16): keep the GitHub Actions used by the workflows up to date.
# Grouped into one pull request per month, because every pull request builds
# the whole image and the repo's build minutes are limited.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
