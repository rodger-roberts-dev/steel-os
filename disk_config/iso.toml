# Steel OS installer ISO settings (STEEL-16).
# Read by bootc-image-builder when the "Build disk images" workflow runs.
# KDE Plasma only; Steel OS does not ship a GNOME ISO.

[customizations.installer.kickstart]
# After the install finishes, point the machine at the Steel OS image in the
# GitHub container registry, so automatic updates come from there.
contents = """
%post
bootc switch --mutate-in-place --transport registry ghcr.io/rodger-roberts-dev/steel-os:latest
%end
"""

[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Storage",
  "org.fedoraproject.Anaconda.Modules.Runtime",
  "org.fedoraproject.Anaconda.Modules.Network",
  "org.fedoraproject.Anaconda.Modules.Security",
  "org.fedoraproject.Anaconda.Modules.Services",
  "org.fedoraproject.Anaconda.Modules.Users",
  "org.fedoraproject.Anaconda.Modules.Timezone"
]

disable = [
  "org.fedoraproject.Anaconda.Modules.Subscription",
]
